name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: AtlasReaper311/atlas-infra/.github/workflows/validate-static.yml@4d472560fbedb1983c09e1cd74830f21baba2f12 # atlas-infra validate-static.yml, the commit that defines its current content (wrangler 4.116.0)
    with:
      project_name: atlas-request-xray
      site_label: xray.atlas-systems.uk
      inject_build_meta: false
    secrets: inherit
